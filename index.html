<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@599&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <img class="logo" src="./image/logo-projeto.gif">
    <main>
        <label>
            Converter <b>de</b>
            <select class="currency-selected">
                <option value="dolar">US$ Dólar americano</option>
                <option value="euro">€ Euro</option>
                <option value="real">R$ Real</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="libra">£ Libra</option>
                <option value="bitcoin">₿ Bitcoin</option>
            </select>
        </label>

        <label>
            <b>Valor</b>
            <input class="input-currency" placeholder="R$ 10.000,00">
        </label>
        <button onclick="convertValues()" class="convert-button">Converter</button>

        <section>
            <div>
                <img class="bandeira" src="./image/brasil 2.png">
                <p class="dinheiro" id="valorReal">Real</p>
                <p class="real">R$ 0,00</p>
            </div>

            <img class="seta" src="./image/Seta.png">
            <div>
                <img class="bandeira-dolar" src="./image/Bandeira-EUA.png">
                <p class="dinheiro" id="valorDolar">Dólar americano</p>
                <p class="dolar">US$ 0,00</p>
            </div>
        </section>
    </main>
    <script src="./style.js"></script>
</body>

</html>
